name: Unit 6

on: [push]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ft-api
      APP_PORT: 80
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build and Deploy
        run: bash deploy.sh

      - name: Run Smoke Test
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${{ env.APP_NAME }})
          echo "Running rapid smoke test on http://$CONTAINER_IP:${{ env.APP_PORT }}/health..."
          curl -f http://$CONTAINER_IP:80/health

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.10

      - name: Run Integration Tests
        run: |
          pip install -r requirements.txt
          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ${{ env.APP_NAME }})
          export TARGET_URL="http://$CONTAINER_IP:${{ env.APP_PORT }}"
          pytest test_api.py
