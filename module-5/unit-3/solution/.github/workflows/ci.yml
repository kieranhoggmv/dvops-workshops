name: Unit 3

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: 3.10

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest

    - name: Package Application (Build Image)
      run: |
        echo "Building app..."
        docker build --tag hello-doe:latest .

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Kill existing apps
      run: |
        echo "Terminating any previous running app..."
        docker stop hello-doe || true

    - name: Run the application
      run: |
        echo "Running app..."
        docker run --rm --detach \
          --name hello-doe \
          --publish 8080:8080 \
          hello-doe:latest

    - name: Healthcheck
      run: |
        sleep 5
        curl --silent --fail localhost:8080