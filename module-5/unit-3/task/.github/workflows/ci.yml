name: Unit 3

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps
    - uses: actions/checkout@v7

    - name: Package Application (Build Image)
      run: |
        echo "Building app..."
        docker build --tag hello-doe:latest .

    - name: Run tests
      run: pytest

    - name: Set up Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: 3.10
      
      - name: Install dependencies
        run: pip install -r requirements.txt
