name: Unit 4

on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code source
        uses: actions/checkout@v7

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-python-version: 3.10

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Authentication
        with_credentials: true
        run: |
          echo "Verifying infrastructure deployment token..."

          if [ -z "$API_TOKEN" ]; then
            echo "AUTHENTICATION CRITICAL ERROR: API_TOKEN is null or undefined." >&2
            exit 1
          fi
          
          echo "Authentication handshake successful."

      - name: Deploy Application Code
        run: bash deploy.sh
